# 感知层触发器配置（部署文档 P4 · rules.toml）
# 修改后无需重启：triggers.py 按 mtime 自动热加载（每 tick 检查一次）。

[general]
# 总开关：false 时插件只记消息（池照进），不做任何决策
# ⚠️ 2026-10-17 16:35 临时置 false：联调时合成的测试事件触发她往真群里发了消息，
#    先停嘴做清理与复核，确认后再由用户打开。
enabled = false

# 机器人自己的 QQ 与昵称（归一化 @ 与判定 "戳的是不是我" 用）
bot_qq = "1000000001"
bot_name = "Persona"

# 只在这些群工作（灰度第 ② 级：单群）。留空 = 不工作（安全默认）
groups = ["1000000003"]

# T1 @ 接管：这些群里由人格回复 @，并 block 掉 chat.py 原有的 @ 回复（priority=99）
# ⚠️ 不在列表里的群保持现有生产行为，避免"双回复"。
# 灰度第 ③ 级（全群）时往这里加群号即可。
handle_at_groups = ["1000000003"]

# T2 戳一戳（target_id == self_id）是否触发
handle_poke = true

# NapCat 会报 notice.group_msg_emoji_like（表情回应），适配器未建模；
# 默认关闭，打开后仅记录 + 可触发（best-effort）
handle_emoji_like = false

# 私聊是否由人格接管（谨慎阶段）。false = 沿用现有 chat.py 私聊回复
handle_private = false

# T4 兜底间隔（秒）：上次决策后至少隔这么久才可能再次被"看一眼"。
# 部署文档建议起步 ≥10 分钟；成本实测≈3k input tokens/次
interval_seconds = 900

# 同一群多个触发器在短窗口内命中时合并成一次决策（避免 @ 与定时器各打一次模型）
debounce_seconds = 6

# 单次决策超时（毫秒），透传给决策桥
decision_timeout_ms = 45000

# 连发多条消息的间隔（毫秒），模拟打字节奏
reply_delay_ms = 1500

# 一次最多发几条（部署文档：≤3 短句）
max_messages = 3

# 拼进 prompt 的"本群新消息"上限（字符）
max_batch_chars = 6000

# 跨群读池（V8）：把其它群最近消息做摘要拼进 prompt
cross_group_digest = true
cross_group_messages = 6
cross_group_max_chars = 1200

# 定时器 tick 间隔（秒）
tick_seconds = 20

# 连续失败多少次后暂停这个群（防止模型/网络故障时无限重试烧 token）
max_fail_streak = 5

[triggers.self_decide]
# T6：她可以在回信里给 NEXT_CHECK: <秒>；没给就用默认值
default_next_check = 900
min_next_check = 60
max_next_check = 3600

# ── T5：北京时间 cron（可多条）──────────────────────────────────────────────
# 5 段：分 时 日 月 周；支持 * / 数字 / */n / a,b / a-b
[[cron]]
expr = "0 8 * * *"
desc = "每天早上八点看一眼大家在聊什么"
groups = ["1000000003"]

[[cron]]
expr = "30 21 * * *"
desc = "晚上九点半看一眼"
groups = ["1000000003"]

# ── T3：指定消息规则（关键词 / 正则 / 指定发送者 / 消息类型）────────────────
[[rule]]
name = "被叫Persona"
groups = ["1000000003"]
# 关键词命中即触发（任一命中）
keywords = ["Persona", "Persona", "Persona"]
# 同一规则在同一群的冷却（秒），防止刷屏
cooldown = 300

